<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Archive QUICK v0.07</title>
<style>
:root{color-scheme:dark;--bg:#071017;--panel:#0d1922;--line:#24404f;--text:#e9f6fb;--muted:#93a9b5;--accent:#62dcff;--gold:#e6c56e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Noto Sans JP",sans-serif}
main{max-width:680px;margin:auto;padding:18px}.brand{font-size:12px;letter-spacing:.2em;color:var(--accent)}
h1{margin:5px 0 3px;font-size:25px}.muted{color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}input,select,textarea,button{width:100%;font:inherit;border-radius:10px;border:1px solid var(--line);padding:11px;background:#09141c;color:var(--text)}
textarea{min-height:110px;resize:vertical}button{cursor:pointer;background:#102a38}.primary{background:#0d4256;border-color:#3fcaf0;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.item{border-top:1px solid var(--line);padding:10px 0}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:11px;color:var(--accent)}
.actions{display:flex;gap:8px;margin-top:9px}.actions button{padding:8px}.empty{text-align:center;color:var(--muted);padding:20px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<div class="brand">LIFE ARCHIVE</div><h1>QUICK</h1>
<div class="muted">外出先で「忘れないうちに入れる」ための軽量受信箱。</div>

<div class="card">
 <div class="row">
  <div><label>分類</label><select id="kind"><option>記録</option><option>タスク</option><option>買い物</option><option>FF14</option><option>TRPG</option><option>健康</option><option>思い出</option><option>メモ</option></select></div>
  <div><label>日付</label><input id="date" type="date"></div>
 </div>
 <label>内容</label><textarea id="text" placeholder="例：牛乳を買う / 極○○でマウント取得 / 30分歩いた"></textarea>
 <label>タグ</label><input id="tags" placeholder="カンマ区切り">
 <button id="save" class="primary" style="margin-top:12px">📥 QUICK受信箱へ保存</button>
</div>

<div class="card">
 <div><b>⏱ Activity Time</b><div class="muted">外出先でも開始・ラップ・休憩・終了を記録。終了したログは「Life Archiveへ渡す」に含まれます。</div></div>
 <label>活動名</label><input id="activityName" placeholder="例：買い物 / 散歩 / TRPG">
 <div class="row">
  <div><label>カテゴリー</label><select id="activityCategory"><option>TRPG</option><option>FF14</option><option>制作</option><option>家事</option><option>健康</option><option>勉強</option><option>外出</option><option>その他</option></select></div>
  <div><label>経過時間</label><div id="activityClock" style="font-size:28px;font-weight:700;padding:7px 0">00:00:00</div></div>
 </div>
 <label>メモ</label><input id="activityMemo" placeholder="任意">
 <div id="activityNow" class="muted" style="margin:8px 0">未計測</div>
 <div class="row"><button id="activityStart" class="primary">▶ 開始</button><button id="activityLap">🏁 ラップ</button></div>
 <div class="row" style="margin-top:8px"><button id="activityPause">⏸ 休憩</button><button id="activityStop">■ 終了</button></div>
 <div id="activityLaps" class="muted" style="margin-top:8px"></div>
 <details style="margin-top:10px"><summary class="muted">この端末の時間記録</summary><div id="activityHistory"></div></details>
</div>

<div class="card">
 <div class="row"><div><b>今日</b><div class="muted" id="count"></div></div><div><button id="export">⇩ Life Archiveへ渡す</button></div></div>
 <div id="transferStatus" class="muted" style="margin-top:8px"></div>
 <div id="transferFallback" style="display:none;margin-top:10px">
  <label>転送データ（最後の手段）</label>
  <textarea id="transferText" readonly></textarea>
  <button id="copyTransfer">コピー</button>
 </div>
 <div id="list"></div>
</div>
<div class="card">
 <div><b>今日やること</b><div class="muted" id="todayTaskCount">PCから未読込</div></div>
 <label>PC版の TODAY JSON</label>
 <input id="todayImportFile" type="file" accept=".json,application/json,*/*">
 <button id="todayImportNow" class="primary" style="margin-top:8px">↑ 選んだ「今日」を読み込む</button>
 <div id="todaySelectedFile" class="muted" style="margin-top:6px">ファイル未選択</div>
 <details style="margin-top:8px"><summary class="muted">どうしても読めない場合</summary>
  <textarea id="todayImportText" placeholder="TODAY JSONの中身を貼り付け"></textarea>
  <button id="todayImportPaste" style="margin-top:8px">貼り付けデータを読み込む</button>
 </details>
 <div id="todayTaskStatus" class="muted" style="margin-top:8px"></div>
 <div id="todayTaskList"></div>
</div>

<div class="card">
 <b>この版について</b>
 <div class="muted" style="margin-top:6px">現在はこの端末内に保存します。「Life Archiveへ渡す」はスマホの共有機能を優先し、使えない端末ではダウンロードまたはコピーへ切り替わります。</div>
</div>
</main>
<script>
const KEY="life_archive_quick_v1", $=id=>document.getElementById(id);
const localDate=()=>{const d=new Date(),z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return[]}};
const save=a=>localStorage.setItem(KEY,JSON.stringify(a));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){const a=load().sort((x,y)=>y.createdAt-x.createdAt);$("count").textContent=`QUICK受信箱 ${a.length}件`;
 $("list").innerHTML=a.length?a.map(x=>`<div class="item"><span class="badge">${esc(x.kind)}</span> <small>${esc(x.date)}</small><div style="margin-top:5px">${esc(x.text).replace(/\n/g,"<br>")}</div>${x.tags.length?`<div class="muted">#${x.tags.map(esc).join(" #")}</div>`:""}<div class="actions"><button data-del="${x.id}">削除</button></div></div>`).join(""):'<div class="empty">まだありません。</div>';
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{save(load().filter(x=>x.id!==b.dataset.del));render()});
}
$("date").value=localDate();
$("save").onclick=()=>{const text=$("text").value.trim();if(!text)return alert("内容を入力してください。");const a=load();a.push({id:"q_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),kind:$("kind").value,date:$("date").value||localDate(),text,tags:$("tags").value.split(",").map(x=>x.trim()).filter(Boolean),createdAt:Date.now(),source:"Life Archive QUICK"});save(a);$("text").value="";$("tags").value="";render()};
function transferPayload(){
 const today=loadToday();
 return {format:"life-archive-quick",version:3,exportedAt:Date.now(),items:load(),today:{date:today.date||"",items:Array.isArray(today.items)?today.items:[]},activityLogs:loadActivityLogs()};
}
function showTransferFallback(text,msg="ファイル保存が使えないため、転送データを表示しました。"){
 $("transferFallback").style.display="block";$("transferText").value=text;$("transferStatus").textContent=msg;
}
$("copyTransfer").onclick=async()=>{
 const text=$("transferText").value;
 try{await navigator.clipboard.writeText(text);$("transferStatus").textContent="転送データをコピーしました。"}catch(e){$("transferText").focus();$("transferText").select();$("transferStatus").textContent="コピーできない場合は、表示された文字列を長押ししてコピーしてください。"}
};


const ACTIVITY_KEY="life_archive_quick_activity_logs_v1",ACTIVITY_TIMER_KEY="life_archive_quick_activity_timer_v1";
const loadActivityLogs=()=>{try{return JSON.parse(localStorage.getItem(ACTIVITY_KEY)||"[]")}catch{return[]}};
const saveActivityLogs=a=>localStorage.setItem(ACTIVITY_KEY,JSON.stringify(a));
const getActivityTimer=()=>{try{return JSON.parse(localStorage.getItem(ACTIVITY_TIMER_KEY)||"null")}catch{return null}};
const putActivityTimer=v=>v?localStorage.setItem(ACTIVITY_TIMER_KEY,JSON.stringify(v)):localStorage.removeItem(ACTIVITY_TIMER_KEY);
const fmtActivity=ms=>{let s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60),r=s%60;return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(r).padStart(2,"0")}`};
const activityActive=(s,n=Date.now())=>s?Number(s.accumulatedMs||0)+(s.running?Math.max(0,n-Number(s.segmentStartedAt||n)):0):0;
function renderActivity(){
 const s=getActivityTimer(),ms=activityActive(s);
 $("activityClock").textContent=fmtActivity(ms);$("activityNow").textContent=s?`${s.category}：${s.name}${s.running?"":"（休憩中）"}`:"未計測";
 $("activityStart").disabled=!!s;$("activityLap").disabled=!s||!s.running;$("activityPause").disabled=!s;$("activityStop").disabled=!s;$("activityPause").textContent=s?.running?"⏸ 休憩":"▶ 再開";
 const laps=s?.laps||[];$("activityLaps").innerHTML=laps.length?laps.map((x,i)=>`Lap ${i+1}：${fmtActivity(x.lapMs)} <span class="muted">（合計 ${fmtActivity(x.totalMs)}）</span>`).join("<br>"):"";
 const logs=[...loadActivityLogs()].sort((a,b)=>b.startedAt-a.startedAt);
 $("activityHistory").innerHTML=logs.length?logs.map(x=>`<div class="item"><b>${esc(x.category)}：${esc(x.name)}</b><div>${fmtActivity(x.activeMs)} ／ ${new Date(x.startedAt).toLocaleString("ja-JP")}</div>${(x.laps||[]).length?`<div class="muted">ラップ：${x.laps.map((l,i)=>`L${i+1} ${fmtActivity(l.lapMs)}`).join(" ／ ")}</div>`:""}<div class="actions"><button data-activity-del="${x.id}">削除</button></div></div>`).join(""):'<div class="empty">まだありません。</div>';
 document.querySelectorAll("[data-activity-del]").forEach(b=>b.onclick=()=>{saveActivityLogs(loadActivityLogs().filter(x=>x.id!==b.dataset.activityDel));renderActivity()});
}
$("activityStart").onclick=()=>{const name=$("activityName").value.trim();if(!name)return alert("活動名を入力してください。");const n=Date.now();putActivityTimer({name,category:$("activityCategory").value||"その他",memo:$("activityMemo").value.trim(),startedAt:n,segmentStartedAt:n,accumulatedMs:0,running:true,pauses:[],laps:[],lastLapTotalMs:0});renderActivity()};
$("activityPause").onclick=()=>{const s=getActivityTimer();if(!s)return;const n=Date.now();if(s.running){s.accumulatedMs=activityActive(s,n);s.running=false;s.pauses.push({startedAt:n,endedAt:0})}else{s.running=true;s.segmentStartedAt=n;const p=s.pauses.at(-1);if(p&&!p.endedAt)p.endedAt=n}putActivityTimer(s);renderActivity()};
$("activityLap").onclick=()=>{const s=getActivityTimer();if(!s||!s.running)return;const n=Date.now(),total=activityActive(s,n),prev=Number(s.lastLapTotalMs||0);s.laps.push({at:n,totalMs:total,lapMs:Math.max(0,total-prev)});s.lastLapTotalMs=total;putActivityTimer(s);renderActivity()};
$("activityStop").onclick=()=>{const s=getActivityTimer();if(!s)return;const n=Date.now(),logs=loadActivityLogs();logs.push({id:"qa_"+n+"_"+Math.random().toString(36).slice(2,7),name:s.name,category:s.category,memo:s.memo,startedAt:s.startedAt,endedAt:n,activeMs:activityActive(s,n),pauses:s.pauses||[],laps:s.laps||[],createdAt:n,source:"Life Archive QUICK"});saveActivityLogs(logs);putActivityTimer(null);$("activityName").value="";$("activityMemo").value="";renderActivity()};

const TODAY_KEY="life_archive_quick_today_v1";
function loadToday(){
 try{
  const raw=localStorage.getItem(TODAY_KEY);
  return raw?JSON.parse(raw):{date:"",items:[]};
 }catch(e){
  return {date:"",items:[]};
 }
}
const saveToday=v=>localStorage.setItem(TODAY_KEY,JSON.stringify(v));
function renderTodayTasks(){
 const data=loadToday(),items=Array.isArray(data.items)?data.items:[];
 $("todayTaskCount").textContent=data.date?`${data.date} ／ ${items.filter(x=>!x.done).length}件未完了`:"PCから未読込";
 $("todayTaskList").innerHTML=items.length?items.map(x=>`<div class="item"><label style="margin:0;color:var(--text)"><input type="checkbox" data-today-id="${esc(x.id)}" ${x.done?"checked":""} style="width:auto"> ${esc(x.text||x.title||"タスク")}</label>${(x.tags||[]).length?`<div class="muted">#${x.tags.map(esc).join(" #")}</div>`:""}</div>`).join(""):'<div class="empty">今日やることはありません。</div>';
 document.querySelectorAll("[data-today-id]").forEach(el=>el.onchange=()=>{const d=loadToday(),x=(d.items||[]).find(v=>String(v.id)===String(el.dataset.todayId));if(!x)return;x.done=el.checked;x.doneAt=el.checked?Date.now():0;saveToday(d);renderTodayTasks()});
}
function applyTodayPayload(payload){
 if(typeof payload==="string")payload=JSON.parse(payload);
 if(!payload||payload.format!=="life-archive-today"||!Array.isArray(payload.items)){
  throw new Error("Life Archiveの「今日」転送データではありません。");
 }
 saveToday({date:String(payload.date||""),items:payload.items,importedAt:Date.now()});
 $("todayTaskStatus").textContent=`${payload.date||"今日"}：${payload.items.length}件読み込みました。`;
 renderTodayTasks();
}
$("todayImportFile").onchange=()=>{
 const f=$("todayImportFile").files&&$("todayImportFile").files[0];
 $("todaySelectedFile").textContent=f?`選択：${f.name}（${f.size} bytes）`:"ファイル未選択";
};
$("todayImportNow").onclick=()=>{
 const f=$("todayImportFile").files&&$("todayImportFile").files[0];
 if(!f)return alert("TODAY JSONを選んでください。");
 $("todayTaskStatus").textContent="読み込み中…";
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   applyTodayPayload(String(reader.result||""));
   $("todayImportFile").value="";
   $("todaySelectedFile").textContent="ファイル未選択";
  }catch(e){
   console.error(e);
   $("todayTaskStatus").textContent="JSONの解析に失敗しました。";
   alert("「今日」を読み込めませんでした："+(e&&e.message?e.message:e));
  }
 };
 reader.onerror=()=>{
  $("todayTaskStatus").textContent="ファイルを開けませんでした。";
  alert("スマホからファイルを開けませんでした。下の貼り付け読み込みを使えます。");
 };
 reader.readAsText(f);
};
$("todayImportPaste").onclick=()=>{
 const text=$("todayImportText").value.trim();
 if(!text)return alert("TODAY JSONを貼り付けてください。");
 try{
  applyTodayPayload(text);
  $("todayImportText").value="";
 }catch(e){
  $("todayTaskStatus").textContent="貼り付けデータを読み込めませんでした。";
  alert("「今日」を読み込めませんでした："+(e&&e.message?e.message:e));
 }
};
$("export").onclick=async()=>{
 const payload=transferPayload(),text=JSON.stringify(payload,null,2),name=`LifeArchive_QUICK_${localDate()}.json`,blob=new Blob([text],{type:"application/json"});
 $("transferStatus").textContent="転送ファイルを準備中…";
 try{
  const file=new File([blob],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
   await navigator.share({title:"Life Archive QUICK",text:"Life Archive QUICK転送ファイル",files:[file]});
   $("transferStatus").textContent="共有先を選びました。ファイルをPCへ送ってください。";
   return;
  }
 }catch(e){
  if(e?.name==="AbortError"){$("transferStatus").textContent="共有をキャンセルしました。";return}
 }
 try{
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=name;a.style.display="none";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  $("transferStatus").textContent="転送ファイルを保存しました。ダウンロード一覧を確認してください。";
  setTimeout(()=>{if(document.visibilityState==="visible")showTransferFallback(text,"保存先が見つからない場合は、下の転送データをコピーできます。")},1200);
 }catch(e){
  showTransferFallback(text);
 }
};
render();renderTodayTasks();renderActivity();setInterval(renderActivity,500);
</script></body></html>
